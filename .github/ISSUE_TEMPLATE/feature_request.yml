name: Feature request
description: Propose a focused improvement to the firmware or documentation
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the problem before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: constraints
    attributes:
      label: Hardware, timing, memory, privacy, or security constraints
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The request preserves local bell detection when network services fail.
        - label: The request does not require publishing private credentials or installation data.
